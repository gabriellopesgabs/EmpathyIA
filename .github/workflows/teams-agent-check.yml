name: Teams agent service check

on:
  pull_request:
    paths:
      - "services/teams-agent/**"
      - "services/teams-agent-tests/**"
      - ".github/workflows/teams-agent-check.yml"
  push:
    branches: [main]
    paths:
      - "services/teams-agent/**"
      - "services/teams-agent-tests/**"
      - ".github/workflows/teams-agent-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            services/teams-agent/Empathy.TeamsAgent.csproj
            services/teams-agent-tests/Empathy.TeamsAgent.Tests.csproj
      - name: Restore reviewed Microsoft media SDK
        run: dotnet restore services/teams-agent-tests/Empathy.TeamsAgent.Tests.csproj
      - name: Build fail-closed service boundary and runtime contract
        working-directory: services/teams-agent
        run: dotnet build --configuration Release --no-restore
      - name: Test provider-receipt state machine
        run: dotnet test services/teams-agent-tests/Empathy.TeamsAgent.Tests.csproj --configuration Release --no-restore
