name: Reusable desktop build

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      target:
        type: string
        required: true
      bundles:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      release-id:
        type: string
        default: ""
      upload-artifact:
        type: boolean
        default: true
      ffmpeg-url:
        type: string
        default: ""
      ffmpeg-sha256:
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ inputs.artifact-name }}
    runs-on: ${{ inputs.platform }}
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ inputs.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ inputs.target }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Provision reviewed FFmpeg artifact (Unix)
        if: runner.os != 'Windows' && inputs.ffmpeg-url != ''
        shell: bash
        env:
          FFMPEG_URL: ${{ inputs.ffmpeg-url }}
          FFMPEG_SHA256: ${{ inputs.ffmpeg-sha256 }}
        run: |
          test -n "$FFMPEG_SHA256"
          curl --fail --location --proto '=https' --tlsv1.2 "$FFMPEG_URL" --output "$RUNNER_TEMP/ffmpeg"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg" | shasum -a 256 --check
          chmod 755 "$RUNNER_TEMP/ffmpeg"
          "$RUNNER_TEMP/ffmpeg" -version
          echo "EMPATHY_FFMPEG_PATH=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"

      - name: Provision reviewed FFmpeg artifact (Windows)
        if: runner.os == 'Windows' && inputs.ffmpeg-url != ''
        shell: pwsh
        env:
          FFMPEG_URL: ${{ inputs.ffmpeg-url }}
          FFMPEG_SHA256: ${{ inputs.ffmpeg-sha256 }}
        run: |
          if (-not $env:FFMPEG_SHA256) { throw "ffmpeg-sha256 is required" }
          $path = Join-Path $env:RUNNER_TEMP "ffmpeg.exe"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $path
          $actual = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256.ToLowerInvariant()) { throw "FFmpeg checksum mismatch" }
          & $path -version
          "EMPATHY_FFMPEG_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Use runner FFmpeg for build validation (Unix)
        if: runner.os != 'Windows' && inputs.ffmpeg-url == ''
        shell: bash
        run: echo "EMPATHY_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Use runner FFmpeg for build validation (Windows)
        if: runner.os == 'Windows' && inputs.ffmpeg-url == ''
        shell: pwsh
        run: |
          $path = (Get-Command ffmpeg.exe).Source
          "EMPATHY_FFMPEG_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build required llama-helper sidecar
        shell: bash
        run: |
          cargo build --locked --release -p llama-helper --target "${{ inputs.target }}"
          mkdir -p frontend/src-tauri/binaries
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ inputs.target }}/release/llama-helper.exe" "frontend/src-tauri/binaries/llama-helper-${{ inputs.target }}.exe"
          else
            cp "target/${{ inputs.target }}/release/llama-helper" "frontend/src-tauri/binaries/llama-helper-${{ inputs.target }}"
          fi

      - name: Build installers
        if: inputs.release-id == ''
        uses: tauri-apps/tauri-action@v0.5.24
        with:
          projectPath: frontend
          tauriScript: pnpm tauri
          args: --target ${{ inputs.target }} --bundles ${{ inputs.bundles }}

      - name: Build and attach installers to draft release
        if: inputs.release-id != ''
        uses: tauri-apps/tauri-action@v0.5.24
        with:
          projectPath: frontend
          tauriScript: pnpm tauri
          args: --target ${{ inputs.target }} --bundles ${{ inputs.bundles }}
          releaseId: ${{ inputs.release-id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload workflow artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            target/${{ inputs.target }}/release/bundle/**/*.dmg
            target/${{ inputs.target }}/release/bundle/**/*.app.tar.gz
            target/${{ inputs.target }}/release/bundle/**/*.app.tar.gz.sig
            target/${{ inputs.target }}/release/bundle/**/*.msi
            target/${{ inputs.target }}/release/bundle/**/*.msi.zip
            target/${{ inputs.target }}/release/bundle/**/*.msi.zip.sig
            target/${{ inputs.target }}/release/bundle/**/*.exe
            target/${{ inputs.target }}/release/bundle/**/*.nsis.zip
            target/${{ inputs.target }}/release/bundle/**/*.nsis.zip.sig
            target/${{ inputs.target }}/release/bundle/**/*.deb
            target/${{ inputs.target }}/release/bundle/**/*.AppImage
            target/${{ inputs.target }}/release/bundle/**/*.AppImage.tar.gz
            target/${{ inputs.target }}/release/bundle/**/*.AppImage.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
