name: Draft release

on:
  workflow_dispatch:
    inputs:
      confirm-version:
        description: "Versão exata de tauri.conf.json (ex.: 0.4.1)"
        required: true
        type: string

concurrency:
  group: empathy-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and updater key
        id: version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm-version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          FFMPEG_MACOS_ARM64_URL: ${{ vars.FFMPEG_MACOS_ARM64_URL }}
          FFMPEG_MACOS_ARM64_SHA256: ${{ vars.FFMPEG_MACOS_ARM64_SHA256 }}
          FFMPEG_MACOS_X64_URL: ${{ vars.FFMPEG_MACOS_X64_URL }}
          FFMPEG_MACOS_X64_SHA256: ${{ vars.FFMPEG_MACOS_X64_SHA256 }}
          FFMPEG_WINDOWS_X64_URL: ${{ vars.FFMPEG_WINDOWS_X64_URL }}
          FFMPEG_WINDOWS_X64_SHA256: ${{ vars.FFMPEG_WINDOWS_X64_SHA256 }}
          FFMPEG_LINUX_X64_URL: ${{ vars.FFMPEG_LINUX_X64_URL }}
          FFMPEG_LINUX_X64_SHA256: ${{ vars.FFMPEG_LINUX_X64_SHA256 }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./frontend/package.json').version")
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' frontend/src-tauri/Cargo.toml | head -1)
          test "$VERSION" = "$CONFIRM_VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$FFMPEG_MACOS_ARM64_URL" && test -n "$FFMPEG_MACOS_ARM64_SHA256"
          test -n "$FFMPEG_MACOS_X64_URL" && test -n "$FFMPEG_MACOS_X64_SHA256"
          test -n "$FFMPEG_WINDOWS_X64_URL" && test -n "$FFMPEG_WINDOWS_X64_SHA256"
          test -n "$FFMPEG_LINUX_X64_URL" && test -n "$FFMPEG_LINUX_X64_SHA256"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "A tag v$VERSION já existe. Atualize a versão nos três arquivos." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  create-draft:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ needs.preflight.outputs.version }}`,
              target_commitish: context.sha,
              name: `Empathy v${{ needs.preflight.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            return String(data.id);

  build:
    needs: [preflight, create-draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: empathy-macos-arm64
            ffmpeg_url: ${{ vars.FFMPEG_MACOS_ARM64_URL }}
            ffmpeg_sha256: ${{ vars.FFMPEG_MACOS_ARM64_SHA256 }}
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: empathy-macos-x64
            ffmpeg_url: ${{ vars.FFMPEG_MACOS_X64_URL }}
            ffmpeg_sha256: ${{ vars.FFMPEG_MACOS_X64_SHA256 }}
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: empathy-windows-x64
            ffmpeg_url: ${{ vars.FFMPEG_WINDOWS_X64_URL }}
            ffmpeg_sha256: ${{ vars.FFMPEG_WINDOWS_X64_SHA256 }}
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: empathy-linux-x64
            ffmpeg_url: ${{ vars.FFMPEG_LINUX_X64_URL }}
            ffmpeg_sha256: ${{ vars.FFMPEG_LINUX_X64_SHA256 }}
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      artifact-name: ${{ matrix.artifact }}
      release-id: ${{ needs.create-draft.outputs.release-id }}
      upload-artifact: false
      ffmpeg-url: ${{ matrix.ffmpeg_url }}
      ffmpeg-sha256: ${{ matrix.ffmpeg_sha256 }}
    secrets: inherit

  summary:
    needs: [preflight, create-draft, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Require manual review and publication
        run: |
          {
            echo "## Rascunho v${{ needs.preflight.outputs.version }} criado"
            echo ""
            echo "Os quatro alvos e o latest.json foram anexados ao rascunho."
            echo "Revise os instaladores e as assinaturas do atualizador antes de publicar."
          } >> "$GITHUB_STEP_SUMMARY"
